name: Heroes Lore IV - Android port build foundation

on:
  push:
    branches:
      - heroes-lore-iv-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hl4-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lgt:
    name: Native LGT emulator compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check LGT runtime
        run: cargo check --locked -p wie-lgt
      - name: Test LGT runtime
        run: cargo test --locked -p wie-lgt
      - name: Check experimental Android ELF loader
        run: cargo check --locked -p wie-lgt --features hl4-android-et-dyn
      - name: Test ELF loader and relocation handling
        run: cargo test --locked -p wie-lgt --features hl4-android-et-dyn
      - name: Check ARM CPU runtime
        run: cargo check --locked -p wie-core-arm
      - name: Check native WIPI C APIs
        run: cargo check --locked -p wie-wipi-c

  android-build-prerequisites:
    name: Android app build prerequisite check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate app and workspace metadata
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          root = pathlib.Path('.')
          cargo = tomllib.loads((root / 'Cargo.toml').read_text())
          app = tomllib.loads((root / 'wie-app/Cargo.toml').read_text())
          assert 'wie-lgt' in cargo['workspace']['members']
          assert app['package']['name'] == 'wie-app'
          assert (root / 'wie-app/tauri.conf.json').is_file()
          assert (root / 'wie-app/src').is_dir()
          # wie-app/gen/android is generated by the Tauri Android init/build stage.
          print('Android Tauri project and LGT crate found.')
          PY
      - name: Verify proprietary game files are not checked into repository
        run: |
          if git ls-files | grep -Ei '(^|/)(binary\.mod|binary\.jar|heroes.?lore|.*\.(apk|jad|jar))$'; then
            echo "::error::Proprietary game files must not be committed to the public repository."
            exit 1
          fi
          echo "No game binary files tracked."


  android-rust:
    name: Android ARM64 native compile (HL4 feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Select Android NDK
        shell: bash
        run: |
          ndk_home="$ANDROID_NDK_LATEST_HOME"
          if [ -z "$ndk_home" ]; then
            ndk_home=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          if [ ! -d "$ndk_home" ]; then
            echo "::error::Android NDK not found"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - name: Set up Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Initialize Android app
        working-directory: wie-app
        run: cargo tauri android init --ci
      - name: Build unsigned debug APK for internal compilation check only
        working-directory: wie-app
        run: cargo tauri android build --apk --debug --ci --target aarch64 --features hl4-android-et-dyn
      - name: Validate Android package was produced
        run: |
          result=$(find wie-app/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$result"
          echo "APK compilation succeeded (does not imply Heroes Lore IV gameplay)"
          sha256sum "$result"
      - name: Preserve debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: hl4-android-arm64-debug-apk
          path: wie-app/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
